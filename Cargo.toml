[package]
name = "han_foo"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]

[dependencies]
cached = "0.59.0"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.120"
web-sys = { version = "0.3.97", features = ["Document", "Element", "HtmlElement", "Window", "MouseEvent", "EventTarget", "console", "CssStyleDeclaration", "DomTokenList", "HtmlDocument", "KeyboardEvent"] }
