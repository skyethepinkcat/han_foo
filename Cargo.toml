[package]
name = "han_foo"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[dependencies]
cached = "0.59.0"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
urlencoding = "2.1.3"
wasm-bindgen = "0.2.120"
wasm-cookies = "0.2.1"
web-sys = { version = "0.3.97", features = ["Document", "Element", "HtmlElement", "Window", "MouseEvent", "EventTarget", "console", "CssStyleDeclaration", "DomTokenList", "HtmlDocument", "KeyboardEvent", "Node", "HtmlInputElement", "NodeList", "InputEvent"] }
